<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }

  .card {
    width: 1080px; height: 1080px;
    background: #0f0f0f;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    padding: 70px 80px;
    overflow: hidden;
  }

  /* グロー背景 */
  .card::before {
    content: '';
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,0.25) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(251,191,36,0.12) 0%, transparent 70%);
    top: 20%; right: 10%;
    pointer-events: none;
  }

  /* ロゴ */
  .logo {
    position: absolute; top: 52px; left: 70px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo-circle {
    width: 48px; height: 48px; border-radius: 50%;
    background: #f97316;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: white;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .logo-text {
    font-size: 28px; font-weight: 900; color: white; letter-spacing: 3px;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  /* 限定バッジ */
  .badge {
    position: absolute; top: 52px; right: 70px;
    background: linear-gradient(135deg, #f97316, #fbbf24);
    color: white; border-radius: 50px; padding: 10px 24px;
    font-size: 18px; font-weight: 900; letter-spacing: 1px;
  }

  /* メインコンテンツ */
  .content {
    width: 100%;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 36px;
    position: relative; z-index: 1;
  }

  .eyebrow {
    font-size: 22px; font-weight: 700;
    color: #f97316; letter-spacing: 4px;
    border: 1px solid rgba(249,115,22,0.4);
    padding: 8px 28px; border-radius: 50px;
    background: rgba(249,115,22,0.08);
  }

  .main-copy {
    font-size: 64px; font-weight: 900; color: white; text-align: center;
    line-height: 1.25; letter-spacing: 2px;
  }
  .main-copy span {
    background: linear-gradient(90deg, #f97316, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .sub-copy {
    font-size: 22px; color: #a1a1aa; text-align: center; line-height: 1.7;
    font-weight: 500;
  }
  .sub-copy strong { color: #e4e4e7; }

  /* ベネフィットカード */
  .benefits {
    display: flex; gap: 20px; width: 100%;
  }
  .benefit {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 28px 24px;
    display: flex; flex-direction: column; gap: 10px;
    align-items: center; text-align: center;
  }
  .benefit-icon { font-size: 36px; }
  .benefit-title { font-size: 18px; font-weight: 900; color: white; }
  .benefit-desc { font-size: 14px; color: #71717a; line-height: 1.6; }

  /* CTA */
  .cta {
    background: linear-gradient(135deg, #f97316, #fbbf24);
    color: white; border-radius: 20px; padding: 28px 60px;
    text-align: center;
  }
  .cta-main { font-size: 28px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; }
  .cta-sub { font-size: 17px; color: rgba(255,255,255,0.85); }

  /* フッター */
  .footer {
    position: absolute; bottom: 44px;
    font-size: 15px; color: #52525b; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-circle">N</div>
    <div class="logo-text">EW OPEN</div>
  </div>
  <div class="badge">限定募集</div>

  <div class="content">
    <div class="eyebrow">BETA TESTER WANTED</div>

    <div class="main-copy">
      リリース前に<br><span>先行体験</span>しませんか？
    </div>

    <div class="sub-copy">
      NewOpenはまもなく正式リリース予定。<br>
      <strong>先行レビュワーを限定で募集します。</strong>
    </div>

    <div class="benefits">
      <div class="benefit">
        <div class="benefit-icon">🔍</div>
        <div class="benefit-title">先行アクセス</div>
        <div class="benefit-desc">リリース前に<br>全機能を体験</div>
      </div>
      <div class="benefit">
        <div class="benefit-icon">💬</div>
        <div class="benefit-title">意見が反映</div>
        <div class="benefit-desc">あなたの声が<br>サービスを作る</div>
      </div>
      <div class="benefit">
        <div class="benefit-icon">🎁</div>
        <div class="benefit-title">特典あり</div>
        <div class="benefit-desc">正式リリース後も<br>継続して使えます</div>
      </div>
    </div>

    <div class="cta">
      <div class="cta-main">プロフィールのリンクから登録 →</div>
      <div class="cta-sub">コメント・DMでもお気軽にどうぞ</div>
    </div>
  </div>

  <div class="footer">newopen.site</div>
</div>
</body>
</html>
