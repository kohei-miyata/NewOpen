<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #f97316 0%, #fbbf24 50%, #fde68a 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    padding: 70px 80px;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0; opacity: 0.1; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 50%, white 1px, transparent 1px),
      radial-gradient(circle at 80% 20%, white 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .logo {
    position: absolute; top: 52px; left: 70px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: white;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .logo-text {
    font-size: 32px; font-weight: 900; color: white; letter-spacing: 3px;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  .badge {
    position: absolute; top: 52px; right: 70px;
    background: white; color: #ea580c;
    border-radius: 50px; padding: 12px 28px;
    font-size: 20px; font-weight: 900;
  }

  .main-copy {
    font-size: 62px; font-weight: 900; color: white; text-align: center;
    line-height: 1.3; letter-spacing: 1px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.12);
    margin-bottom: 44px;
  }
  .main-copy .accent { font-size: 80px; display: block; }

  /* クーポンカード大 */
  .coupon-big {
    width: 100%;
    background: white;
    border-radius: 24px;
    padding: 36px 44px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .coupon-big::before {
    content: '';
    position: absolute; left: -1px; top: 0; bottom: 0; width: 12px;
    background: linear-gradient(180deg, #f97316, #fbbf24);
    border-radius: 24px 0 0 24px;
  }
  .coupon-label {
    font-size: 18px; color: #f97316; font-weight: 900; margin-bottom: 8px;
    padding-left: 20px;
  }
  .coupon-title {
    font-size: 38px; font-weight: 900; color: #111; margin-bottom: 8px;
    padding-left: 20px;
  }
  .coupon-title span { color: #f97316; }
  .coupon-desc {
    font-size: 18px; color: #666; padding-left: 20px; margin-bottom: 20px;
  }
  .coupon-code-row {
    display: flex; align-items: center; gap: 16px; padding-left: 20px;
  }
  .coupon-code {
    background: #fff7ed; border: 2px dashed #fb923c;
    border-radius: 10px; padding: 12px 24px;
    font-size: 28px; font-weight: 900; color: #ea580c; letter-spacing: 4px;
  }
  .coupon-copy-btn {
    background: #f97316; color: white; border-radius: 10px;
    padding: 12px 24px; font-size: 18px; font-weight: 700;
  }

  /* 説明3点 */
  .points {
    display: flex; gap: 20px; width: 100%;
  }
  .point {
    flex: 1; background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 16px; padding: 22px 18px; text-align: center;
  }
  .point-icon { font-size: 32px; margin-bottom: 8px; }
  .point-text { font-size: 18px; font-weight: 900; color: white; line-height: 1.4; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-circle">N</div>
    <div class="logo-text">EW OPEN</div>
  </div>
  <div class="badge">クーポン機能</div>

  <div class="main-copy">
    初来店の<br>ハードルを<br>
    <span class="accent">下げよう</span>
  </div>

  <div class="coupon-big">
    <div class="coupon-label">🎟 限定クーポン</div>
    <div class="coupon-title">全品 <span>10% OFF</span></div>
    <div class="coupon-desc">ご来店のお客様全員にご利用いただけます</div>
    <div class="coupon-code-row">
      <div class="coupon-code">OPEN10</div>
      <div class="coupon-copy-btn">コピー</div>
    </div>
  </div>

  <div class="points">
    <div class="point">
      <div class="point-icon">✏️</div>
      <div class="point-text">発行は<br>無料・即時</div>
    </div>
    <div class="point">
      <div class="point-icon">📱</div>
      <div class="point-text">会員ログインで<br>コード表示</div>
    </div>
    <div class="point">
      <div class="point-icon">📊</div>
      <div class="point-text">使用状況を<br>管理画面で確認</div>
    </div>
  </div>
</div>
</body>
</html>
