<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #f97316 0%, #fbbf24 50%, #fde68a 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    padding: 70px 80px;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0; opacity: 0.1; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 50%, white 1px, transparent 1px),
      radial-gradient(circle at 80% 20%, white 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* ロゴ */
  .logo {
    position: absolute; top: 52px; left: 70px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: white;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .logo-text {
    font-size: 32px; font-weight: 900; color: white; letter-spacing: 3px;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  /* ターゲットバッジ */
  .target-badge {
    position: absolute; top: 52px; right: 70px;
    background: white; color: #ea580c;
    border-radius: 50px; padding: 12px 28px;
    font-size: 20px; font-weight: 900;
  }

  /* メインコピー */
  .main-copy {
    font-size: 64px; font-weight: 900; color: white; text-align: center;
    line-height: 1.25; letter-spacing: 1px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.12);
    margin-bottom: 44px;
  }
  .main-copy span { display: block; }
  .main-copy .accent {
    font-size: 76px; letter-spacing: -1px;
  }

  /* 特徴3つ */
  .features {
    display: flex; gap: 20px; margin-bottom: 48px; width: 100%;
  }
  .feat {
    flex: 1; background: rgba(255,255,255,0.22);
    border: 2px solid rgba(255,255,255,0.45);
    border-radius: 20px; padding: 28px 20px;
    text-align: center; backdrop-filter: blur(4px);
  }
  .feat-icon { font-size: 36px; margin-bottom: 10px; }
  .feat-title { font-size: 20px; font-weight: 900; color: white; margin-bottom: 6px; line-height: 1.3; }
  .feat-desc { font-size: 15px; color: rgba(255,255,255,0.85); line-height: 1.5; }

  /* CTA */
  .cta-area {
    width: 100%; background: rgba(0,0,0,0.15);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 24px; padding: 30px 48px;
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
  }
  .cta-left { }
  .cta-label { font-size: 18px; color: rgba(255,255,255,0.8); margin-bottom: 6px; }
  .cta-url { font-size: 26px; font-weight: 900; color: white; letter-spacing: 0.5px; }
  .cta-dm { font-size: 18px; color: rgba(255,255,255,0.8); margin-top: 6px; }
  .cta-btn {
    background: white; color: #f97316;
    border-radius: 50px; padding: 18px 44px;
    font-size: 22px; font-weight: 900; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-circle">N</div>
    <div class="logo-text">EW OPEN</div>
  </div>

  <div class="target-badge">開業3年以内のお店限定</div>

  <div class="main-copy">
    <span>集客、</span>
    <span class="accent">完全無料</span>
    <span>ではじめよう</span>
  </div>

  <div class="features">
    <div class="feat">
      <div class="feat-icon">🆓</div>
      <div class="feat-title">掲載料<br>完全無料</div>
      <div class="feat-desc">登録から掲載まで<br>ずっと0円</div>
    </div>
    <div class="feat">
      <div class="feat-icon">📍</div>
      <div class="feat-title">地図・SNS<br>まとめて掲載</div>
      <div class="feat-desc">住所・営業時間・<br>リンクを一括管理</div>
    </div>
    <div class="feat">
      <div class="feat-icon">🎟️</div>
      <div class="feat-title">限定クーポンで<br>新規集客</div>
      <div class="feat-desc">来店を後押しする<br>クーポン機能付き</div>
    </div>
  </div>

  <div class="cta-area">
    <div class="cta-left">
      <div class="cta-label">▶ 登録はリンクから（無料・最短5分）</div>
      <div class="cta-url">new-open.vercel.app/for-owners</div>
      <div class="cta-dm">ご不明点はDMでお気軽にどうぞ</div>
    </div>
    <div class="cta-btn">無料で登録 →</div>
  </div>
</div>
</body>
</html>
