<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #d1d5db;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 32px 20px;
    font-family: 'Hiragino Sans', sans-serif;
  }
  .export-btn {
    margin-bottom: 20px;
    background: #1f2937; color: white;
    border: none; border-radius: 10px;
    padding: 12px 32px; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .export-btn:hover { background: #374151; }

  .card {
    width: 1080px; height: 1080px;
    background: #111827;
    position: relative;
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 100px 110px;
  }

  /* 背景グロー */
  .glow {
    position: absolute;
    top: -100px; right: -100px;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,0.18) 0%, transparent 65%);
    pointer-events: none;
  }

  /* ロゴ */
  .logo {
    position: absolute; top: 56px; left: 100px;
    display: flex; align-items: center; gap: 12px;
  }
  .logo-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: #f97316;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: white;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .logo-text {
    font-size: 28px; font-weight: 900; color: white;
    letter-spacing: 3px;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  /* バッジ */
  .badge {
    position: absolute; top: 56px; right: 100px;
    border: 1.5px solid rgba(249,115,22,0.5);
    color: #fb923c;
    border-radius: 50px; padding: 12px 28px;
    font-size: 17px; font-weight: 700; letter-spacing: 1px;
  }

  /* メイン */
  .eyebrow {
    font-size: 18px; font-weight: 700;
    color: #f97316; letter-spacing: 3px;
    margin-bottom: 28px;
  }

  .headline {
    font-size: 96px; font-weight: 900;
    color: white; line-height: 1.15;
    letter-spacing: -1px;
    margin-bottom: 36px;
  }
  .headline .accent {
    color: #f97316;
  }

  .body {
    font-size: 28px; color: rgba(255,255,255,0.6);
    line-height: 1.8; margin-bottom: 32px;
    font-weight: 500;
  }
  .body strong {
    color: rgba(255,255,255,0.9);
    font-weight: 700;
  }

  /* CTA */
  .cta {
    display: flex; align-items: center; gap: 24px;
  }
  .cta-main {
    background: #f97316;
    color: white; font-size: 26px; font-weight: 900;
    padding: 24px 52px; border-radius: 16px;
    letter-spacing: 1px;
    box-shadow: 0 0 40px rgba(249,115,22,0.4);
  }
  .cta-sub {
    font-size: 21px; color: rgba(255,255,255,0.4);
    font-weight: 500;
  }

  /* ハイライト */
  .highlight {
    display: inline-flex; align-items: center; gap: 12px;
    background: rgba(249,115,22,0.12);
    border: 1px solid rgba(249,115,22,0.3);
    border-radius: 12px;
    padding: 16px 28px;
    margin-bottom: 48px;
  }
  .highlight-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f97316; flex-shrink: 0;
  }
  .highlight-text {
    font-size: 22px; font-weight: 700;
    color: rgba(255,255,255,0.75); line-height: 1.5;
  }
  .highlight-text span { color: #fb923c; }

  /* 横線装飾 */
  .line {
    position: absolute; bottom: 80px; left: 100px; right: 100px;
    height: 1px; background: rgba(255,255,255,0.07);
  }
  .url {
    position: absolute; bottom: 52px; left: 100px;
    font-size: 15px; color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
    font-family: 'Arial', sans-serif;
  }
</style>
</head>
<body>

<button class="export-btn" onclick="exportImage()">画像として保存（PNG）</button>

<div class="card" id="card">
  <div class="glow"></div>

  <div class="logo">
    <div class="logo-circle">N</div>
    <div class="logo-text">EW OPEN</div>
  </div>
  <div class="badge">オーナー様へ</div>

  <div class="eyebrow">FREE · 登録代行 · 新規集客</div>

  <div class="headline">
    お店を<span class="accent">無料</span>で<br />
    掲載させて<br />
    ください。
  </div>

  <div class="body">
    登録作業は<strong>すべてこちらで代行</strong>します。<br />
    写真と基本情報を送るだけで大丈夫です。
  </div>

  <div class="highlight">
    <div class="highlight-dot"></div>
    <div class="highlight-text">新規サービスのため掲載店舗を募集中。<span>今なら完全無料・先着順</span>で対応します。</div>
  </div>

  <div class="cta">
    <div class="cta-main">Instagram DM へ</div>
    <div class="cta-sub">お気軽にどうぞ →</div>
  </div>

  <div class="line"></div>
  <div class="url">newopen.site</div>
</div>

<script>
  async function exportImage() {
    const card = document.getElementById('card');
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: null,
    });
    const link = document.createElement('a');
    link.download = 'newopen_post12.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
