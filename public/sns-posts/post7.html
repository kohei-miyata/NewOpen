<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #f97316 0%, #fbbf24 50%, #fde68a 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    padding: 70px 80px;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0; opacity: 0.1; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 50%, white 1px, transparent 1px),
      radial-gradient(circle at 80% 20%, white 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .logo {
    position: absolute; top: 52px; left: 70px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: white;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .logo-text {
    font-size: 32px; font-weight: 900; color: white; letter-spacing: 3px;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  .badge {
    position: absolute; top: 52px; right: 70px;
    background: white; color: #ea580c;
    border-radius: 50px; padding: 12px 28px;
    font-size: 20px; font-weight: 900;
  }

  .main-copy {
    font-size: 66px; font-weight: 900; color: white; text-align: center;
    line-height: 1.25; letter-spacing: 1px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.12);
    margin-bottom: 16px;
  }
  .main-copy .accent {
    font-size: 80px; display: block;
  }

  .sub-copy {
    font-size: 26px; color: rgba(255,255,255,0.9); text-align: center;
    margin-bottom: 52px; line-height: 1.6;
  }

  /* タイムライン */
  .timeline {
    width: 100%;
    display: flex; flex-direction: column; gap: 20px;
  }
  .tl-item {
    display: flex; align-items: center; gap: 28px;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 20px; padding: 24px 32px;
  }
  .tl-day {
    background: white; color: #f97316;
    border-radius: 14px; padding: 10px 20px;
    font-size: 18px; font-weight: 900; text-align: center;
    white-space: nowrap; flex-shrink: 0; line-height: 1.4;
  }
  .tl-day .num { font-size: 32px; display: block; line-height: 1; }
  .tl-content { flex: 1; }
  .tl-title { font-size: 24px; font-weight: 900; color: white; margin-bottom: 4px; }
  .tl-desc { font-size: 16px; color: rgba(255,255,255,0.8); line-height: 1.5; }
  .tl-arrow {
    font-size: 28px; color: rgba(255,255,255,0.6);
    font-weight: 900; flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-circle">N</div>
    <div class="logo-text">EW OPEN</div>
  </div>
  <div class="badge">オープン前から告知</div>

  <div class="main-copy">
    <span class="accent">30日前</span>
    から掲載できる
  </div>

  <div class="sub-copy">オープン前から話題をつくろう</div>

  <div class="timeline">
    <div class="tl-item">
      <div class="tl-day">
        <span class="num">30</span>
        日前〜
      </div>
      <div class="tl-content">
        <div class="tl-title">「まもなくオープン」として掲載</div>
        <div class="tl-desc">エリアのユーザーに事前告知。フォロワー獲得にも</div>
      </div>
      <div class="tl-arrow">→</div>
    </div>
    <div class="tl-item">
      <div class="tl-day" style="color:#16a34a;">
        <span class="num" style="font-size:28px;">当日</span>
      </div>
      <div class="tl-content">
        <div class="tl-title">「本日オープン」で最上位表示</div>
        <div class="tl-desc">オープン当日はTOPに優先表示。最大露出を獲得</div>
      </div>
      <div class="tl-arrow">→</div>
    </div>
    <div class="tl-item">
      <div class="tl-day">
        <span class="num">3</span>
        年間
      </div>
      <div class="tl-content">
        <div class="tl-title">継続掲載で集客し続ける</div>
        <div class="tl-desc">エリア検索・ランキングに3年間掲載</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
