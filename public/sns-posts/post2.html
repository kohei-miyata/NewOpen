<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .card {
    width: 1080px; height: 1080px; background: linear-gradient(135deg, #f97316 0%, #fbbf24 50%, #fde68a 100%);
    display: flex; flex-direction: column;
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0; opacity: 0.1; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 50%, white 1px, transparent 1px),
      radial-gradient(circle at 80% 20%, white 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .top-band {
    background: linear-gradient(135deg, #f97316 0%, #fbbf24 100%); padding: 36px 60px;
    display: flex; align-items: center; gap: 20px;
  }
  .logo-s { font-family: 'Arial Black', Arial, sans-serif;
    font-size: 36px; font-weight: 900; color: white; letter-spacing: 2px; }
  .top-label { font-size: 28px; font-weight: 900; color: white; margin-left: auto; }

  .main { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 40px 80px; }

  .free-badge {
    background: linear-gradient(135deg, #fff7ed, #ffedd5);
    border: 4px solid #f97316; border-radius: 24px;
    padding: 40px 80px; text-align: center; margin-bottom: 50px; width: 100%;
  }
  .free-label { font-size: 28px; color: #9a3412; font-weight: 700; margin-bottom: 8px; }
  .free-big { font-size: 88px; font-weight: 900; color: #f97316;
    line-height: 1; letter-spacing: -2px; }
  .free-sub { font-size: 36px; font-weight: 900; color: #ea580c; margin-top: 8px; }

  .features { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 50px; }
  .feat {
    background: #fff7ed; border-radius: 16px; padding: 24px 28px;
    display: flex; align-items: center; gap: 16px;
  }
  .feat-icon {
    width: 48px; height: 48px; background: #f97316; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .feat-text { font-size: 22px; font-weight: 700; color: #1f2937; }

  .bottom-band {
    background: rgba(0,0,0,0.15); padding: 28px 60px;
    display: flex; align-items: center; justify-content: center;
  }
  .bottom-text { font-size: 26px; font-weight: 900; color: white; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="card">
  <div class="top-band">
    <div class="logo-s">NEW OPEN</div>
    <div class="top-label">オーナー様へ</div>
  </div>

  <div class="main">
    <div class="free-badge">
      <div class="free-label">掲載料</div>
      <div class="free-big">完全無料</div>
      <div class="free-sub">登録から掲載まで0円</div>
    </div>

    <div class="features">
      <div class="feat">
        <div class="feat-icon">✓</div>
        <div class="feat-text">掲載・編集いつでも無料</div>
      </div>
      <div class="feat">
        <div class="feat-icon">🎟</div>
        <div class="feat-text">クーポン発行機能付き</div>
      </div>
      <div class="feat">
        <div class="feat-icon">📅</div>
        <div class="feat-text">オープン前から告知できる</div>
      </div>
      <div class="feat">
        <div class="feat-icon">📍</div>
        <div class="feat-text">地図・SNSリンクを掲載</div>
      </div>
    </div>
  </div>

  <div class="bottom-band">
    <div class="bottom-text">今すぐ登録 → new-open.vercel.app/for-owners</div>
  </div>
</div>
</body>
</html>
