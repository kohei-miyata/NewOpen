<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e5e7eb;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 32px 20px;
    font-family: 'Hiragino Sans', sans-serif;
  }

  .export-btn {
    margin-bottom: 20px;
    background: #1f2937; color: white;
    border: none; border-radius: 10px;
    padding: 12px 32px; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .export-btn:hover { background: #374151; }

  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #f97316 0%, #fbbf24 50%, #fde68a 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    padding: 70px 80px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0; opacity: 0.08; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 50%, white 1.5px, transparent 1.5px),
      radial-gradient(circle at 80% 20%, white 1.5px, transparent 1.5px);
    background-size: 60px 60px;
  }

  /* ロゴ */
  .logo {
    position: absolute; top: 52px; left: 70px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: white;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .logo-text {
    font-size: 32px; font-weight: 900; color: white; letter-spacing: 3px;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  /* バッジ群 */
  .badges {
    position: absolute; top: 52px; right: 70px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .badge-attention {
    background: #1f2937; color: #fbbf24;
    border-radius: 50px; padding: 10px 22px;
    font-size: 17px; font-weight: 900; letter-spacing: 1px;
  }
  .badge-free {
    background: white; color: #ea580c;
    border-radius: 50px; padding: 10px 22px;
    font-size: 20px; font-weight: 900;
  }

  /* キャッチコピー */
  .main-copy {
    font-size: 56px; font-weight: 900; color: white; text-align: center;
    line-height: 1.25; letter-spacing: 1px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.12);
    margin-bottom: 6px;
  }
  .main-copy .accent {
    font-size: 70px; display: block;
  }

  .sub-copy {
    font-size: 20px; color: rgba(255,255,255,0.95); text-align: center;
    margin-bottom: 18px; line-height: 1.6; font-weight: 700;
  }

  /* カテゴリーバー */
  .category-bar {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 22px;
  }
  .category-chip {
    background: rgba(255,255,255,0.22);
    border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 50px; padding: 6px 18px;
    font-size: 15px; font-weight: 700; color: white;
    display: flex; align-items: center; gap: 8px;
  }
  .category-chip svg { flex-shrink: 0; }

  /* ベネフィットリスト */
  .benefits {
    width: 100%;
    display: flex; flex-direction: column; gap: 13px;
  }
  .benefit-item {
    display: flex; align-items: center; gap: 22px;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 20px; padding: 16px 26px;
  }
  .benefit-icon {
    background: white;
    border-radius: 14px; width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: #f97316;
  }
  .benefit-content { flex: 1; }
  .benefit-title { font-size: 21px; font-weight: 900; color: white; margin-bottom: 3px; }
  .benefit-desc { font-size: 14px; color: rgba(255,255,255,0.82); line-height: 1.5; }
  .benefit-tag {
    background: white; color: #f97316;
    border-radius: 50px; padding: 5px 16px;
    font-size: 14px; font-weight: 900;
    white-space: nowrap; flex-shrink: 0;
  }
</style>
</head>
<body>

<button class="export-btn" onclick="exportImage()">画像として保存（PNG）</button>

<div class="card" id="card">
  <div class="logo">
    <div class="logo-circle">N</div>
    <div class="logo-text">EW OPEN</div>
  </div>

  <div class="badges">
    <div class="badge-attention">オーナー様必見</div>
    <div class="badge-free">今だけ完全無料</div>
  </div>

  <div class="main-copy">
    <span class="accent">新サービスで</span>
    無料でお店を掲載できます
  </div>

  <div class="sub-copy">入力が面倒な方は代行します。お気軽に DM ください</div>

  <!-- カテゴリー -->
  <div class="category-bar">
    <div class="category-chip">
      <!-- fork & knife -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/></svg>
      飲食店
    </div>
    <div class="category-chip">
      <!-- coffee -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
      カフェ
    </div>
    <div class="category-chip">
      <!-- scissors -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
      美容院
    </div>
    <div class="category-chip">
      <!-- sparkles -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L9.5 9.5 3 12l6.5 2.5L12 21l2.5-6.5L21 12l-6.5-2.5z"/></svg>
      ネイル
    </div>
    <div class="category-chip">
      <!-- heart -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      エステ
    </div>
    <div class="category-chip">
      <!-- more -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      その他多数
    </div>
  </div>

  <div class="benefits">
    <!-- 1 -->
    <div class="benefit-item">
      <div class="benefit-icon">
        <!-- trending up -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      </div>
      <div class="benefit-content">
        <div class="benefit-title">新規リリースで認知・集客を拡大</div>
        <div class="benefit-desc">オープン情報を探しているユーザーに直接リーチ</div>
      </div>
      <div class="benefit-tag">新規開拓</div>
    </div>
    <!-- 2 -->
    <div class="benefit-item">
      <div class="benefit-icon">
        <!-- camera -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <div class="benefit-content">
        <div class="benefit-title">写真・店舗情報の掲載を代行</div>
        <div class="benefit-desc">情報を送るだけ。登録作業はこちらで代行</div>
      </div>
      <div class="benefit-tag">代行OK</div>
    </div>
    <!-- 3 -->
    <div class="benefit-item">
      <div class="benefit-icon">
        <!-- tag -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      </div>
      <div class="benefit-content">
        <div class="benefit-title">クーポン発行で新規顧客を獲得</div>
        <div class="benefit-desc">オープン記念クーポンでリピーターを増やす</div>
      </div>
      <div class="benefit-tag">無料</div>
    </div>
    <!-- 4 -->
    <div class="benefit-item">
      <div class="benefit-icon">
        <!-- bar chart -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
      </div>
      <div class="benefit-content">
        <div class="benefit-title">閲覧数・いいね数をリアルタイム確認</div>
        <div class="benefit-desc">Instagram・HP リンクも掲載可能</div>
      </div>
      <div class="benefit-tag">無料</div>
    </div>
  </div>
</div>

<script>
  async function exportImage() {
    const card = document.getElementById('card');
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: null,
    });
    const link = document.createElement('a');
    link.download = 'newopen_post10.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
